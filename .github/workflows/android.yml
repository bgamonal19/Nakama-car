# Compila la app Android de NAKAMA CAR (APK) cuando cambia la carpeta android/.
# Sin claves: deja el APK sin firmar como artefacto (sirve para comprobar que compila).
# Con los secretos ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD (los pone el propietario
# en Settings → Secrets; alias "nakama" y misma contraseña por defecto), en main lo firma y
# lo publica en Releases. La clave nunca se guarda en el repositorio.
name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: SDK Android (platform 35, build-tools 35.0.0)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Compilar
        run: bash android/build.sh
      - name: Pruebas
        run: |
          javac -d android/build/tests android/src/com/nakamacar/estimate/NavigationPolicy.java android/tests/NavigationPolicyTest.java
          java -cp android/build/tests com.nakamacar.estimate.NavigationPolicyTest
          node --test android/tests/native.test.cjs
      - name: Firmar (solo si hay clave)
        id: sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' android/AndroidManifest.xml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -z "$KEYSTORE" ]; then echo "Sin clave: APK sin firmar."; exit 0; fi
          KEY_ALIAS="${KEY_ALIAS:-nakama}"
          KEY_PASS="${KEY_PASS:-$STORE_PASS}"
          export KEY_PASS
          # Spaces/newlines from copy-paste are ignored.
          if ! printf '%s' "$KEYSTORE" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" 2> "$RUNNER_TEMP/err.txt"; then
            echo "::error title=Clave Android::El secreto ANDROID_KEYSTORE_BASE64 no es un texto base64 válido: vuelve a copiarlo con base64 -i … | pbcopy"; exit 1
          fi
          echo "Clave: $(wc -c < "$RUNNER_TEMP/release.jks") bytes"
          if [ -z "${STORE_PASS}" ]; then echo "::error title=Clave Android::Falta el secreto ANDROID_KEYSTORE_PASSWORD"; exit 1; fi
          # Which aliases the keystore holds (no secrets printed).
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -storepass:env STORE_PASS > "$RUNNER_TEMP/list.txt" 2>&1 && \
             ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env STORE_PASS > "$RUNNER_TEMP/list.txt" 2>&1; then
            msg=$(head -c 300 "$RUNNER_TEMP/list.txt" | tr '\n' ' ')
            echo "::error title=Clave Android::No se puede abrir la clave (¿contraseña distinta?): $msg"; rm -f "$RUNNER_TEMP/release.jks"; exit 1
          fi
          echo "::notice title=Clave Android::Alias en la clave: $(grep -i 'PrivateKeyEntry' "$RUNNER_TEMP/list.txt" | cut -d, -f1 | tr '\n' ' ')"
          if ! "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:STORE_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "android/build/dist/NAKAMA-CAR-$VERSION.apk" android/build/dist/nakama-car-unsigned.apk > "$RUNNER_TEMP/sign.txt" 2>&1; then
            msg=$(head -c 400 "$RUNNER_TEMP/sign.txt" | tr '\n' ' ')
            echo "::error title=Firma Android::$msg"; rm -f "$RUNNER_TEMP/release.jks"; exit 1
          fi
          rm -f "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "android/build/dist/NAKAMA-CAR-$VERSION.apk"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: nakama-car-android
          path: android/build/dist/*.apk
      - name: Publicar en Releases
        if: steps.sign.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${{ steps.sign.outputs.version }}"
          FILE="android/build/dist/NAKAMA-CAR-${{ steps.sign.outputs.version }}.apk"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "NAKAMA CAR Android ${{ steps.sign.outputs.version }}" --notes "App Android NAKAMA CAR."
          gh release upload "$TAG" "$FILE" --clobber
