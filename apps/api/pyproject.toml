[project]
name = "nakama-estimate-api"
version = "0.1.0"
description = "NAKAMA CAR ESTIMATE API by ONE SISTEM"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.5",
  "email-validator>=2.2",
  "python-jose[cryptography]>=3.3",
  "argon2-cffi>=23.1",
  "boto3>=1.35",
  "reportlab>=4.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["migrations*"]

[tool.ruff]
line-length = 100
target-version = "py312"
